name: ip-regression-test

on:
  push:
    branches:
      - dev
    paths:
      - "ip/**"
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug checkout
        run: |
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Branch=$(git branch --show-current)"

          echo ""
          echo "Git tree:"
          git ls-tree -r --name-only HEAD -- ip/wdt/syn/

          echo ""
          echo "Filesystem:"
          ls -la ip/wdt/syn/

          echo ""
          echo "Check run_syn.tcl:"
          test -f ip/wdt/syn/run_syn.tcl

      - name: Build toolchain
        run: make build

      - name: Detect changed IPs
        shell: bash
        run: |
          git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            -- 'ip/*' \
            | awk -F/ 'NF >= 2 {print $2}' \
            | grep -v '^template$' \
            | sort -u > changed_ips.txt

          echo "Changed IPs:"
          cat changed_ips.txt

      - name: Run simulation and synthesis
        shell: bash
        run: |
          source set_env.sh

          while IFS= read -r ip; do
            [[ -z "$ip" ]] && continue

            echo "========================================"
            echo "Testing IP: $ip"
            echo "========================================"

            (
              cd "ip/$ip/sim"
              source run_sim.sh
            )

            (
              cd "ip/$ip/syn"

              echo ""
              echo "------------------------------------------------------------"
              echo "Synthesis debug"
              echo "------------------------------------------------------------"
              echo "PWD        : $PWD"
              echo "IP         : $ip"
              echo "IP_HOME    : ${IP_HOME:-}"
              echo "WDT_HOME   : ${WDT_HOME:-}"

              echo ""
              echo "Synthesis files:"
              ls -la

              echo ""
              echo "Checking run_syn.tcl:"
              test -f run_syn.tcl
              echo "run_syn.tcl exists"

              source run_syn.sh
            )

          done < changed_ips.txt
