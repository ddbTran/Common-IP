name: toolchain-build-test

on:
  push:
    branches:
      - dev
    paths:
      - "scripts/**"
      - "Makefile"
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify toolchain
        run: make build
