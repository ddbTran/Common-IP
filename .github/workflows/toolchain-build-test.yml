name: toolchain-build-test

on:
  push:
    paths:
      - "set_env.sh"
      - "scripts/**"
      - "Makefile"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify toolchain
        run: make build

